# https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions
name: Check KasmVNC release

# The Docker image pins KasmVNC (version + sha256) in docker/image/Dockerfile, which Dependabot
# cannot update. This opens an issue when upstream has published a newer release.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    # https://github.blog/changelog/2020-07-06-github-actions-manual-triggers-with-workflow_dispatch/

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository_owner == 'Second-Hand-Friends'

    steps:
    - name: Git checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
      # https://github.com/actions/checkout

    - name: Compare pinned and latest version
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eu

        pinned=$(sed -n 's/^ARG KASMVNC_VERSION=//p' docker/image/Dockerfile)
        latest=$(gh api repos/kasmtech/KasmVNC/releases/latest --jq .tag_name | sed 's/^v//')
        echo "pinned=$pinned latest=$latest"

        [ "$pinned" != "$latest" ] || exit 0

        title="Update KasmVNC in the Docker image to $latest"
        if [ -n "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
          exit 0
        fi

        gh issue create --title "$title" --label dependencies --body "KasmVNC $latest is available (the Docker image pins $pinned).

        Update \`KASMVNC_VERSION\` and the \`KASMVNC_SHA256_AMD64\` / \`KASMVNC_SHA256_ARM64\` build args in \`docker/image/Dockerfile\`
        (assets: https://github.com/kasmtech/KasmVNC/releases/tag/v$latest, \`kasmvncserver_trixie_*\`), then run \`bash docker/image/test-startup.sh\`.

        Opened by the \`Check KasmVNC release\` workflow."
